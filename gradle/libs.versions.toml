[versions]
# Language
java = "25"

# Plugins
springBoot = "3.5.16"
springBootDependencyManagement = "1.1.7"
openApiGenerator = "7.26.0"

# Libraries
postgresql = "42.7.14"
lombok = "1.18.48"
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"
springdoc = "2.10.0"
checkstyle = "14.3.0"
archunit = "1.5.1"
wiremock = "4.4.3"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "springBootDependencyManagement" }
open-api-generator = { id = "org.openapi.generator", version.ref = "openApiGenerator" }